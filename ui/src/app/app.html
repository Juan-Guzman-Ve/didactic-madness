<div class="app-layout">
  <mat-toolbar class="navbar">
    <a class="logo" [routerLink]="'/' + routes.HOME">
      <mat-icon>computer</mat-icon>
      <span>PC<strong>Store</strong></span>
    </a>

    <nav class="nav-links">
      <a mat-button [routerLink]="routes.PRODUCTS" routerLinkActive="active-link">
        Products
      </a>
      @if (authService.isAuthenticated()) {
        <a mat-button [routerLink]="routes.ORDERS" routerLinkActive="active-link">
          My Orders
        </a>
      }
    </nav>

    <span class="flex-1"></span>

    <div class="nav-actions">
      @if (authService.isAuthenticated()) {
        <a mat-icon-button [routerLink]="routes.CART" aria-label="Cart">
          <mat-icon
            [matBadge]="cartService.cartCount() > 0 ? cartService.cartCount() : null"
            matBadgeColor="warn"
            matBadgeSize="small">
            shopping_cart
          </mat-icon>
        </a>

        <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ authService.currentUser()?.firstName }}</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <a mat-menu-item [routerLink]="routes.ORDERS">
            <mat-icon>receipt_long</mat-icon> My Orders
          </a>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon> Sign Out
          </button>
        </mat-menu>
      } @else {
        <a mat-button [routerLink]="routes.AUTH_LOGIN">Sign In</a>
        <a mat-raised-button color="primary" [routerLink]="routes.AUTH_REGISTER">Register</a>
      }
    </div>
  </mat-toolbar>

  <main class="main-content">
    <router-outlet />
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-logo">PC<strong>Store</strong></span>
      <span>© 2026 PC Parts Store. All rights reserved.</span>
    </div>
  </footer>
</div>
