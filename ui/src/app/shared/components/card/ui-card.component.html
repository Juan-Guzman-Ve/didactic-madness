<mat-card class="ui-card">
  @if (imageUrl()) {
    <img mat-card-image [src]="imageUrl()" [alt]="title()" />
  }

  <mat-card-header>
    @if (title()) {
      <mat-card-title>{{ title() }}</mat-card-title>
    }
    @if (subtitle()) {
      <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>
    }
  </mat-card-header>

  <mat-card-content>
    <ng-content />
  </mat-card-content>

  @if (hasActions()) {
    <mat-divider />
    <mat-card-actions>
      <ng-content select="[actions]" />
    </mat-card-actions>
  }
</mat-card>
