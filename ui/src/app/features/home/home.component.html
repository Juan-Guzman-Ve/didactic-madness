<div class="home">
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">Build Your<br><strong>Dream Setup</strong></h1>
      <p class="hero-subtitle">Premium PC components for every build — from budget to beast.</p>
      <div class="hero-actions">
        <a mat-raised-button color="primary" [routerLink]="routes.PRODUCTS" class="hero-btn-primary">
          Shop Components
        </a>
        <a mat-stroked-button [routerLink]="routes.PRODUCTS" class="hero-btn-secondary">
          Browse All
        </a>
      </div>
    </div>
  </section>

  <!-- Shop by Category -->
  <section class="section">
    <div class="container">
      <h2 class="section-title">Shop by Category</h2>
      @if (loading()) {
        <div class="skeleton-grid">
          @for (i of categorySkeleton; track i) {
            <div class="skeleton-card"></div>
          }
        </div>
      } @else {
        <div class="category-grid">
          @for (cat of categories(); track cat.id) {
            <a class="category-card" [routerLink]="routes.PRODUCTS" [queryParams]="{ categoryId: cat.id }">
              <img [src]="categoryImageUrl(cat.slug)" [alt]="cat.name" class="category-img" loading="lazy" />
              <span class="category-name">{{ cat.name }}</span>
            </a>
          }
        </div>
      }
    </div>
  </section>
</div>
