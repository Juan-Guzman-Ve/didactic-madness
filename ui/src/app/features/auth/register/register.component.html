<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-content>
      <div class="auth-header">
        <mat-icon class="brand-icon">computer</mat-icon>
        <span class="brand-name">PC<strong>Store</strong></span>
      </div>

      <h2 class="form-title">Create an account</h2>
      <p class="form-subtitle">Join us to start building your dream setup.</p>

      @if (errorMessage()) {
        <div class="error-alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="name-row">
          <ui-input
            label="First name"
            type="text"
            placeholder="John"
            [control]="$any(form.controls.firstName)"
            [required]="true" />

          <ui-input
            label="Last name"
            type="text"
            placeholder="Doe"
            [control]="$any(form.controls.lastName)"
            [required]="true" />
        </div>

        <ui-input
          label="Email address"
          type="email"
          icon="mail"
          placeholder="your@email.com"
          [control]="$any(form.controls.email)"
          [required]="true" />

        <ui-input
          label="Password"
          type="password"
          icon="lock"
          placeholder="••••••••"
          [control]="$any(form.controls.password)"
          [required]="true" />

        <div class="submit-row">
          <ui-button
            label="Create account"
            type="submit"
            variant="primary"
            [loading]="loading()"
            [disabled]="form.invalid || loading()" />
        </div>
      </form>

      <mat-divider class="divider" />

      <p class="auth-footer">
        Already have an account?
        <a [routerLink]="'/' + routes.AUTH_LOGIN">Sign in</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
