<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-content>
      <div class="auth-header">
        <mat-icon class="brand-icon">computer</mat-icon>
        <span class="brand-name">PC<strong>Store</strong></span>
      </div>

      <h2 class="form-title">Sign in</h2>
      <p class="form-subtitle">Welcome back. Enter your credentials to continue.</p>

      @if (justRegistered()) {
        <div class="success-alert">
          <mat-icon>check_circle_outline</mat-icon>
          <span>Account created! Sign in to continue.</span>
        </div>
      }

      @if (errorMessage()) {
        <div class="error-alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
        <ui-input
          label="Email address"
          type="email"
          icon="mail"
          placeholder="your@email.com"
          [control]="$any(form.controls.email)"
          [required]="true" />

        <ui-input
          label="Password"
          type="password"
          icon="lock"
          placeholder="••••••••"
          [control]="$any(form.controls.password)"
          [required]="true" />

        <div class="submit-row">
          <ui-button
            label="Sign in"
            type="submit"
            variant="primary"
            [loading]="loading()"
            [disabled]="form.invalid || loading()" />
        </div>
      </form>

      <mat-divider class="divider" />

      <p class="auth-footer">
        Don't have an account?
        <a [routerLink]="'/' + routes.AUTH_REGISTER">Create one</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
